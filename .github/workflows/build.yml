name: build

# Builds real binaries in the cloud — no local toolchain required.
#   push / PR  -> artifacts (zip / apk / tar.gz) on the run page
#   tag v1.2.3 -> GitHub Release with the same files attached
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: Sonora

jobs:
  # ---------------------------------------------------------------- WINDOWS
  windows:
    name: Windows (exe + installer)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($tag -notmatch '^\d+\.\d+\.\d+') { $tag = '1.0.0' }
          "version=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "version = $tag"

      - name: Generate platform folders
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File tool/setup_platforms.ps1

      - name: Toolchain info
        continue-on-error: true
        run: flutter doctor -v

      - name: Dependencies
        run: flutter pub get

      # Fails in ~60 s with "file.dart:LINE:COL: Error: ..." instead of a
      # 3-minute native build error. Errors are also written to the run
      # summary, so they are visible without opening the raw log.
      - name: Static analysis
        shell: bash
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos > analyze.log 2>&1 || true
          ERRORS="$(grep -E '^ *error ' analyze.log || true)"
          if [ -n "$ERRORS" ]; then
            {
              echo '### Analyze errors'
              echo '```'
              echo "$ERRORS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$ERRORS"
            exit 1
          fi
          echo 'analyze: no errors'

      - name: Build release
        run: flutter build windows --release

      - name: Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $rel = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$rel\flutter_windows.dll")) { throw "Release folder not found" }
          Set-Content -Path "$rel\PORTABLE.txt" -Value "Portable build. Settings: %APPDATA%\Sonora." -Encoding UTF8
          Compress-Archive -Path "$rel\*" -DestinationPath "dist\${{ env.APP_NAME }}-${{ steps.ver.outputs.version }}-portable-win64.zip" -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "tool\installer\sonora.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- ANDROID
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: bash tool/setup_platforms.sh

      - name: Toolchain info
        continue-on-error: true
        run: flutter doctor -v

      - name: Dependencies
        run: flutter pub get

      # Fails in ~60 s with "file.dart:LINE:COL: Error: ..." instead of a
      # 3-minute native build error. Errors are also written to the run
      # summary, so they are visible without opening the raw log.
      - name: Static analysis
        shell: bash
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos > analyze.log 2>&1 || true
          ERRORS="$(grep -E '^ *error ' analyze.log || true)"
          if [ -n "$ERRORS" ]; then
            {
              echo '### Analyze errors'
              echo '```'
              echo "$ERRORS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$ERRORS"
            exit 1
          fi
          echo 'analyze: no errors'

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Sonora-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Sonora-arm32.apk || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------------- RELEASE
  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*-setup.exe
            artifacts/*.apk
