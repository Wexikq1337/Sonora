name: build

# Builds real binaries in the cloud — no local toolchain required.
#   push / PR  -> artifacts (zip / apk / tar.gz) on the run page
#   tag v1.2.3 -> GitHub Release with the same files attached
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: Sonora

jobs:
  # ---------------------------------------------------------------- WINDOWS
  windows:
    name: Windows (exe + installer)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($tag -notmatch '^\d+\.\d+\.\d+') { $tag = '1.0.0' }
          "version=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "version = $tag"

      - name: Generate platform folders
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File tool/setup_platforms.ps1

      - name: Dependencies
        run: flutter pub get

      - name: Build release
        run: flutter build windows --release

      - name: Portable ZIP
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$rel\flutter_windows.dll")) { throw "Release folder not found" }
          Set-Content -Path "$rel\PORTABLE.txt" -Value "Portable build. Settings: %APPDATA%\Sonora." -Encoding UTF8
          Compress-Archive -Path "$rel\*" -DestinationPath "dist\${{ env.APP_NAME }}-${{ steps.ver.outputs.version }}-portable-win64.zip" -Force

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "tool\installer\sonora.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- ANDROID
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: bash tool/setup_platforms.sh

      - name: Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Sonora-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Sonora-arm32.apk || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ LINUX
  linux:
    name: Linux (AppImage-less bundle)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: bash tool/setup_platforms.sh

      - name: Dependencies
        run: flutter pub get

      - name: Build release
        run: flutter build linux --release

      - name: Package bundle
        run: |
          mkdir -p dist
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/dist/Sonora-linux-x64.tar.gz" .
          cd "$GITHUB_WORKSPACE"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------------- RELEASE
  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*-setup.exe
            artifacts/*.apk
            artifacts/*.tar.gz
