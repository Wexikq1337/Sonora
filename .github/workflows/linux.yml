name: build-linux

# Linux packaging is temporarily DISABLED for the main pipeline: the job is
# red (GStreamer/CMake deps on the runner) and we don't want it to mark the
# whole run as failed. Run it by hand when you want to work on Linux:
#   Actions -> build-linux -> Run workflow
on:
  workflow_dispatch:

jobs:
  linux:
    name: Linux bundle (experimental)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: bash tool/setup_platforms.sh

      - name: Toolchain info
        continue-on-error: true
        run: flutter doctor -v

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release
        run: flutter build linux --release

      - name: Package bundle
        run: |
          mkdir -p dist
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/dist/Sonora-linux-x64.tar.gz" .
          cd "$GITHUB_WORKSPACE"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
